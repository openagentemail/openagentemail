name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing requires npm CLI >= 11.5.1 (node 22 ships npm 10)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Test
        working-directory: packages/api
        run: |
          bun install
          bun run check:approval-publication
          bun test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/mcp
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(node -p "require('../../server.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "package.json: $PKG_VERSION, server.json: $SRV_VERSION, tag: $TAG_VERSION"
          test "$PKG_VERSION" = "$TAG_VERSION"
          test "$SRV_VERSION" = "$TAG_VERSION"

      - name: Build @openagentemail/mcp
        working-directory: packages/mcp
        run: |
          bun install
          bun run build

      - name: Publish to npm
        working-directory: packages/mcp
        run: npm publish --provenance --access public --ignore-scripts

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
