# 危险路径守卫 (tizerluo/zcode-open-bridge#49 洞三的 GitHub 侧防线)
# .zcode/config.json / zcode.json 会被 zcode 在启动时直接执行其中定义的
# 命令 (进程 spawn, 不经过模型也不受工具黑名单约束), 禁止入库。
# 主防线是受保护基线分支的 push 与受控标签。任意 PR 分支 push 不可信。
# PR 用 pull_request_target，工作流来自基线分支，是合并前的可信检查。
# 权限只有 contents: read 与 pull-requests: read。没有写入权限、没有密钥、不留评论。
# 不检出、不执行 PR 或合并树上的文件。只把 head SHA 当 Git Trees API 的数据。
# 组织或企业的事件策略由所有者跟进。公开的强制日是 2026-11-02。
name: zcode-config-guard

on:
  pull_request_target:
  push:
    paths:
      - ".zcode/config.json"
      - "zcode.json"
      - ".zcode"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zcode-config-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 检查变更是否触碰 ZCode 项目配置
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 四段 API 各限 20 秒；SHA 只作路径数据，不跟随响应 URL。
          set -eu
          die() { printf '%s\n' "::error::$1" >&2; exit 1; }
          [[ "$REPO" =~ ^[^/]+/[^/]+$ ]] || die "仓库名畸形"
          [[ "$PR" =~ ^[0-9]+$ ]] || die "PR 号畸形"
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || die "HEAD SHA 畸形"
          call() {
            local phase="$1"; shift
            local out rc
            set +e
            out="$(timeout 20 gh api "$@")"
            rc=$?
            set -e
            if [ "$rc" -eq 124 ]; then die "${phase}超时"; fi
            if [ "$rc" -ne 0 ] || [ -z "$out" ]; then die "${phase}失败"; fi
            printf '%s' "$out"
          }
          META="$(call 元数据 "repos/$REPO/pulls/$PR")"
          mk="$(printf '%s' "$META" | jq -r --arg pr "$PR" --arg sha "$HEAD_SHA" '
            if type!="object" or (.number|type)!="number" or (.number|floor)!=.number then "malformed"
            elif (.number|tostring)!=$pr then "pr"
            elif (.head|type)!="object" or (.head.sha|type)!="string" or (.head.sha|test("^[0-9a-fA-F]{40}$")|not) then "sha"
            elif .head.sha!=$sha then "head"
            elif (.changed_files|type)!="number" or (.changed_files|floor)!=.changed_files or .changed_files<0 then "count"
            elif .changed_files>3000 then "cap"
            else "ok:\(.changed_files)" end')" || die "元数据畸形"
          case "$mk" in
            ok:*) ;;
            pr) die "PR 号与事件不一致" ;;
            sha) die "HEAD SHA 畸形" ;;
            head) die "HEAD 与事件不一致" ;;
            count) die "changed_files 畸形" ;;
            cap) die "changed_files 超过 3000" ;;
            *) die "元数据畸形" ;;
          esac
          N="${mk#ok:}"
          FILES="$(call 文件列表 --paginate --slurp "repos/$REPO/pulls/$PR/files?per_page=100")"
          fk="$(printf '%s' "$FILES" | jq -r --argjson n "$N" 'if type!="array" or length==0 then "absent"
            elif any(.[]; type!="array") then "pagetype"
            elif any(.[]; length>100) then "oversize"
            elif any(.[0:length-1][]; length!=100) then "sequence"
            elif any(.[][]; type!="object" or (.filename|type)!="string" or .filename=="") then "name"
            elif any(.[][]; has("previous_filename") and ((.previous_filename|type)!="string" or .previous_filename=="")) then "name"
            elif any(.[][]; .status=="renamed" and (has("previous_filename")|not)) then "name"
            else [ .[][].filename ] as $f | if ($f|length)!=($f|unique|length) then "dup"
            elif ($f|length)!=$n then "count"
            elif any($f[]; .==".zcode/config.json" or .=="zcode.json") then "forbid"
            elif any(.[][]; .previous_filename==".zcode/config.json" or .previous_filename=="zcode.json") then "forbid"
            else "ok" end end')" || die "文件列表畸形"
          case "$fk" in
            ok) ;;
            absent) die "文件响应缺失" ;;
            pagetype) die "文件页类型畸形" ;;
            oversize) die "文件页过大" ;;
            sequence) die "文件页序畸形" ;;
            name) die "文件名畸形" ;;
            dup) die "文件名重复" ;;
            count) die "文件数量与 changed_files 不一致" ;;
            forbid) die "检测到 ZCode 项目配置文件变更" ;;
            *) die "文件列表畸形" ;;
          esac
          ROOT="$(call 根树 "repos/$REPO/git/trees/$HEAD_SHA")"
          schema='def pair:
            ((.mode=="100644" or .mode=="100755" or .mode=="120000") and .type=="blob")
            or (.mode=="040000" and .type=="tree")
            or (.mode=="160000" and .type=="commit");
          def bad:
            type!="object"
            or (.path|type)!="string"
            or .path==""
            or (.path|test("/"))
            or (.sha|type)!="string"
            or (.sha|test("^[0-9a-fA-F]{40}$")|not)
            or (pair|not);'
          tk="$(printf '%s' "$ROOT" | jq -r "$schema"'
            if type!="object" or (.tree|type)!="array" or .truncated!=false then "shape"
            elif any(.tree[]; bad) then "entry"
            elif ([.tree[].path]|unique|length)!=(.tree|length) then "dup"
            elif any(.tree[]; .path=="zcode.json") then "rootjson"
            elif any(.tree[]; .path==".zcode" and .mode=="120000") then "symlink"
            elif any(.tree[]; .path==".zcode" and .mode=="160000") then "gitlink"
            elif any(.tree[]; .path==".zcode" and .mode=="040000") then "child:\([.tree[]|select(.path==".zcode").sha][0])"
            else "ok" end')" || die "根树畸形"
          case "$tk" in
            ok) printf '%s\n' "变更未触碰危险路径, 通过"; exit 0 ;;
            shape) die "根树畸形或被截断" ;;
            entry) die "根树条目畸形" ;;
            dup) die "根树路径重复" ;;
            rootjson) die "根路径 zcode.json 禁止入库" ;;
            symlink) die "根路径 .zcode 符号链接禁止入库" ;;
            gitlink) die "根路径 .zcode gitlink 禁止入库" ;;
            child:*) ;;
            *) die "根树畸形" ;;
          esac
          child="${tk#child:}"
          [[ "$child" =~ ^[0-9a-fA-F]{40}$ ]] || die "子树 SHA 畸形"
          CHILD="$(call 子树 "repos/$REPO/git/trees/$child")"
          ck="$(printf '%s' "$CHILD" | jq -r "$schema"'
            if type!="object" or (.tree|type)!="array" or .truncated!=false then "shape"
            elif any(.tree[]; bad) then "entry"
            elif ([.tree[].path]|unique|length)!=(.tree|length) then "dup"
            elif any(.tree[]; .path=="config.json") then "config"
            else "ok" end')" || die "子树畸形"
          case "$ck" in
            ok) printf '%s\n' "变更未触碰危险路径, 通过" ;;
            shape) die "子树畸形或被截断" ;;
            entry) die "子树条目畸形" ;;
            dup) die "子树路径重复" ;;
            config) die "子路径 .zcode/config.json 禁止入库" ;;
            *) die "子树畸形" ;;
          esac

      - name: push 触发即危险 (paths 已过滤)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          echo "::error::push 触碰根 .zcode 符号链接或 .zcode/config.json / zcode.json，禁止入库"
          exit 1

      - name: 检出被标记提交
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 标签树根路径 ZCode 配置
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/zcode-config-tag-tree.sh
