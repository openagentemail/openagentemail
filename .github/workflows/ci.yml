name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Test mail-security scripts
        run: bash deploy/test-mail-security.sh

      - name: Test packages/api
        working-directory: packages/api
        run: |
          bun install
          bun run check:approval-publication
          bun test
          bun run lint:ui

      - name: Typecheck + build packages/mcp
        working-directory: packages/mcp
        run: |
          bun install
          bunx tsc --noEmit
          bun run build
