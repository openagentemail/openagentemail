name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"

      - name: Test mail-security scripts
        run: bash deploy/test-mail-security.sh

      - name: Test packages/api
        working-directory: packages/api
        run: |
          bun install
          # #234：CI 常驻 Chromium，钉同意页 Approve 表单 Origin:null 头形态
          bunx playwright install --with-deps chromium
          bun run check:approval-publication
          bun test
          bun run lint:ui

      - name: Typecheck + build + test packages/mcp
        working-directory: packages/mcp
        run: |
          bun install
          bunx tsc --noEmit
          bun run build
          bun test

  # 独立 10000 行 fill 腿；不改默认 test job。预算仍在测试文件内。
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Capacity fill suite
        working-directory: packages/api
        run: |
          bun install
          bun run test:capacity

  # #93：API 运行时镜像契约（dist-only、生产依赖、non-root、healthz、lockfile fail-closed）
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t oae-api-smoke packages/api

      - name: Assert runtime artifact set
        run: |
          # dist-only + 无 dev 包
          docker run --rm --entrypoint sh oae-api-smoke -c \
            'test -f dist/main.js && test ! -f package.json && test ! -d node_modules/typescript'
          # P1 属主双断言：可执行件 root、数据目录 bun
          test "$(docker run --rm --entrypoint stat oae-api-smoke -c %u dist/main.js)" = "0"
          test "$(docker run --rm --entrypoint stat oae-api-smoke -c %u /app/data)" = "1000"

      - name: Assert non-root uid
        run: |
          uid="$(docker run --rm --entrypoint id oae-api-smoke -u)"
          echo "uid=${uid}"
          test "${uid}" = "1000"

      - name: Healthz responds 200
        run: |
          cid="$(docker run -d -p 3100:3100 \
            -e DOMAIN=smoke.example \
            -e API_KEYS=smoke-ci-key \
            -e IMAP_USER=agent@smoke.example \
            -e IMAP_PASS=smoke-pass \
            -e SMTP_USER=agent@smoke.example \
            -e SMTP_PASS=smoke-pass \
            -e DATA_DIR=/app/data \
            -e UI_ENABLED=false \
            oae-api-smoke)"
          cleanup() { docker rm -f "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/healthz || true)"
            if [ "${code}" = "200" ]; then
              ok=1
              break
            fi
            sleep 1
          done
          test "${ok}" = "1"
          # DATA_DIR 写探针（bun 可写数据目录）
          docker exec "${cid}" sh -c 'touch /app/data/.w93-write-probe && test -f /app/data/.w93-write-probe'

      - name: Lockfile negative control (package.json drift must fail frozen)
        working-directory: packages/api
        run: |
          cp package.json package.json.bak
          # 无论成败，还原 package.json（bun.lock 保持可解析、不动）
          restore_pkg() { mv -f package.json.bak package.json 2>/dev/null || true; }
          trap restore_pkg EXIT
          # package.json 漂移：新增 dependency，lockfile 仍合法可解析
          python3 -c '
          import json
          from pathlib import Path
          p = Path("package.json")
          data = json.loads(p.read_text())
          data.setdefault("dependencies", {})["left-pad"] = "1.3.0"
          p.write_text(json.dumps(data, indent=2) + "\n")
          '
          # docker build（Dockerfile 内 --frozen-lockfile）必须红
          set +e
          docker build -t oae-api-smoke-neg .
          rc=$?
          set -e
          test "${rc}" -ne 0
          # 区分度：同一漂移树两份独立拷贝——plain install 成功、frozen 失败（证明红的是 flag 非语法）
          # 注意：勿用 --production 作 plain 对照（Bun 生产安装路径对漂移亦会拒写 lock）
          tmp_plain="$(mktemp -d)"
          tmp_frozen="$(mktemp -d)"
          cp package.json bun.lock "${tmp_plain}/"
          cp package.json bun.lock "${tmp_frozen}/"
          set +e
          docker run --rm -e CI= -v "${tmp_plain}:/work" -w /work oven/bun:1 \
            bun install
          plain_rc=$?
          docker run --rm -e CI= -v "${tmp_frozen}:/work" -w /work oven/bun:1 \
            bun install --frozen-lockfile
          frozen_rc=$?
          set -e
          # 容器可能以 root 写 node_modules；用 alpine root 清理，不依赖宿主机 sudo
          docker run --rm -v "${tmp_plain}:/work" alpine sh -c 'rm -rf /work/*'
          docker run --rm -v "${tmp_frozen}:/work" alpine sh -c 'rm -rf /work/*'
          rmdir "${tmp_plain}" "${tmp_frozen}" 2>/dev/null || true
          test "${plain_rc}" -eq 0
          test "${frozen_rc}" -ne 0
