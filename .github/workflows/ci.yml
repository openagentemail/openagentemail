name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"

      - name: Test mail-security scripts
        run: bash deploy/test-mail-security.sh

      - name: Test packages/api
        working-directory: packages/api
        run: |
          bun install
          # #234：CI 常驻 Chromium，钉同意页 Approve 表单 Origin:null 头形态
          bunx playwright install --with-deps chromium
          bun run check:approval-publication
          bun test
          bun run lint:ui

      - name: Typecheck + build + test packages/mcp
        working-directory: packages/mcp
        run: |
          bun install
          bunx tsc --noEmit
          bun run build
          bun test

  # 独立 10000 行 fill 腿；不改默认 test job。预算仍在测试文件内。
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Capacity fill suite
        working-directory: packages/api
        run: |
          bun install
          bun run test:capacity

  # #93：API 运行时镜像契约（dist-only、生产依赖、non-root、healthz、lockfile fail-closed）
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t oae-api-smoke packages/api

      - name: Assert runtime artifact set
        run: |
          docker run --rm --entrypoint sh oae-api-smoke -c \
            'test -f dist/main.js && test ! -f package.json && test ! -d node_modules/typescript'

      - name: Assert non-root uid
        run: |
          uid="$(docker run --rm --entrypoint id oae-api-smoke -u)"
          echo "uid=${uid}"
          test "${uid}" = "1000"

      - name: Healthz responds 200
        run: |
          cid="$(docker run -d -p 3100:3100 \
            -e DOMAIN=smoke.example \
            -e API_KEYS=smoke-ci-key \
            -e IMAP_USER=agent@smoke.example \
            -e IMAP_PASS=smoke-pass \
            -e SMTP_USER=agent@smoke.example \
            -e SMTP_PASS=smoke-pass \
            -e DATA_DIR=/app/data \
            -e UI_ENABLED=false \
            oae-api-smoke)"
          cleanup() { docker rm -f "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/healthz || true)"
            if [ "${code}" = "200" ]; then
              ok=1
              break
            fi
            sleep 1
          done
          test "${ok}" = "1"

      - name: Lockfile negative control (build must fail)
        working-directory: packages/api
        run: |
          cp bun.lock bun.lock.bak
          # 破坏 lockfile 哈希/内容，强制 frozen-lockfile 失败
          sed -i '1s/.*/{"lockfileVersion":1,"tampered":true}/' bun.lock || \
            printf '%s\n' '{"lockfileVersion":1,"tampered":true}' > bun.lock
          set +e
          set +e
          docker build -t oae-api-smoke-neg .
          rc=$?
          set -e
          mv -f bun.lock.bak bun.lock
          test "${rc}" -ne 0
