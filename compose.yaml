# openagent.email — one-command self-hosted email platform for AI agents.
#
# Two services:
#   mailserver — docker-mailserver (Postfix + Dovecot + OpenDKIM). ONE catch-all
#                mailbox on $DOMAIN; every identity address lands in it.
#   api        — the openagent.email REST/MCP API. Reads the catch-all via IMAP,
#                sends via SMTP with a rewritten From, exposes :3100.
#
# Usage:
#   cp .env.example .env   # fill in DOMAIN, API_KEYS, MAIL_PASSWORD
#   docker compose up -d
#   ./deploy/dns-records.sh
#   ./deploy/doctor.sh

name: openagentemail

services:
  # One-shot provisioner: creates the catch-all account, wildcard alias and DKIM
  # key BEFORE the mailserver starts. Required because docker-mailserver refuses
  # to start Dovecot without at least one account (user-patches.sh runs too late).
  provision:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: openagent-provision
    env_file: .env
    volumes:
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        setup email add "$${MAIL_ACCOUNT:-agent}@$${DOMAIN}" "$${MAIL_PASSWORD}" || true
        setup alias add "@$${DOMAIN}" "$${MAIL_ACCOUNT:-agent}@$${DOMAIN}" || true
        setup config dkim
        # Self-signed TLS so IMAPS/465 work out of the box (DMS's SSL_TYPE=self-signed
        # expects pre-made files; swap to SSL_TYPE=letsencrypt for a real cert later).
        SSL_DIR=/tmp/docker-mailserver/ssl
        MAIL_HOST="mail.$${DOMAIN}"
        if [ ! -f "$$SSL_DIR/$$MAIL_HOST-cert.pem" ]; then
          mkdir -p "$$SSL_DIR/demoCA"
          openssl req -x509 -newkey rsa:4096 -nodes -days 3650 \
            -subj "/CN=$$MAIL_HOST" -addext "subjectAltName=DNS:$$MAIL_HOST" \
            -keyout "$$SSL_DIR/$$MAIL_HOST-key.pem" -out "$$SSL_DIR/$$MAIL_HOST-cert.pem"
          cp "$$SSL_DIR/$$MAIL_HOST-cert.pem" "$$SSL_DIR/demoCA/cacert.pem"
        fi
    restart: "no"

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mail.${DOMAIN:?Set DOMAIN in .env}
    container_name: openagent-mailserver
    env_file: .env
    depends_on:
      provision:
        condition: service_completed_successfully
    environment:
      # --- required DMS identity ---
      OVERRIDE_HOSTNAME: mail.${DOMAIN}
      # TLS: self-signed out of the box (generated by the provision service);
      # set SSL_TYPE=letsencrypt in .env (+ uncomment port 80) for a real cert.
      SSL_TYPE: ${SSL_TYPE:-self-signed}
      # --- small-VPS defaults (tunable in .env if you have RAM to spare) ---
      ENABLE_CLAMAV: ${ENABLE_CLAMAV:-0}        # antivirus off: ClamAV needs ~1GB RAM
      ENABLE_FAIL2BAN: ${ENABLE_FAIL2BAN:-1}    # brute-force protection on
      ENABLE_SPAMASSASSIN: ${ENABLE_SPAMASSASSIN:-0}
      ONE_DIR: 1                                # single mail dir, simpler backups
      PERMIT_DOCKER: connected-networks         # trust the compose network (api -> smtp/imap)
      # DKIM signing is ON by default in docker-mailserver (opendkim).
      # Keys are generated by deploy/user-patches.sh on first start and land in
      # ./docker-data/dms/config/opendkim/keys/${DOMAIN}/ — dns-records.sh reads them.
      # --- optional outbound relay (SES, Mailgun, ...). Blank = send direct. ---
      DEFAULT_RELAY_HOST: ${DEFAULT_RELAY_HOST:-}
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-587}
      RELAY_USER: ${RELAY_USER:-}
      RELAY_PASSWORD: ${RELAY_PASSWORD:-}
    ports:
      - "25:25"     # SMTP    (inbound mail from the world)
      - "465:465"   # SMTPS   (implicit TLS submission)
      - "587:587"   # Submission (STARTTLS)
      - "993:993"   # IMAPS
      # Uncomment for HTTP-01 Let's Encrypt via DMS's built-in certbot
      # (requires SSL_TYPE=letsencrypt and SSL_DOMAIN=mail.${DOMAIN} in .env):
      # - "80:80"
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      # Bind-mounted (not a named volume) so you can inspect/edit DMS config and
      # so deploy/dns-records.sh can read the generated DKIM public key:
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      # SMTP + IMAPS listening means Postfix/Dovecot are up.
      # NOTE: `ss -n` is required — without -n, ss prints service NAMES
      # (smtp/imap2/submissions) instead of port numbers and the grep never matches.
      test: ["CMD-SHELL", "ss -n --listening --tcp | grep -q ':25 ' && ss -n --listening --tcp | grep -q ':993 '"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s   # first boot generates DH params / DKIM keys — be patient

  # One-shot API helper: writes the private ntfy server.yml and JSON topic/token
  # map before ntfy starts. It uses the same code as API startup, not a second
  # shell implementation of the notification security model.
  ntfy-provision:
    build: ./packages/api
    container_name: openagent-ntfy-provision
    command: ["bun", "run", "src/ntfy-provision.ts"]
    environment:
      DOMAIN: ${DOMAIN}
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env (openssl rand -hex 32)}
      IMAP_HOST: mailserver
      IMAP_PORT: 993
      IMAP_TLS: "true"
      IMAP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      IMAP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      SMTP_HOST: mailserver
      SMTP_PORT: 587
      SMTP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      SMTP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      DATA_DIR: /app/data
      NTFY_STORAGE_DIR: /var/lib/openagentemail/ntfy
      NOTIFY_PUBLIC_URL: ${NOTIFY_PUBLIC_URL:-http://127.0.0.1:2586}
      NTFY_UPSTREAM: ${NTFY_UPSTREAM:-true}
      NTFY_ADMIN_PASSWORD: ${NTFY_ADMIN_PASSWORD:?Set NTFY_ADMIN_PASSWORD in .env (openssl rand -hex 24)}
    volumes:
      - api-data:/app/data
    restart: "no"

  ntfy:
    # Pin the major release line rather than a floating latest tag.
    image: binwiederhier/ntfy:v2
    container_name: openagent-ntfy
    depends_on:
      ntfy-provision:
        condition: service_completed_successfully
    command: ["serve", "--config", "/var/lib/openagentemail/ntfy/server.yml"]
    init: true
    volumes:
      # ntfy's own cache/auth files and openagent's JSON route/token map stay
      # together with the API's owner-only data volume.
      - api-data:/var/lib/openagentemail
    ports:
      # Phone delivery may use a deliberate HTTPS reverse proxy. Never publish
      # this Docker port to the internet directly.
      - "127.0.0.1:${NTFY_PORT:-2586}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./packages/api
    container_name: openagent-api
    depends_on:
      mailserver:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    environment:
      # --- shared API contract env ---
      DOMAIN: ${DOMAIN}
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env (openssl rand -hex 32)}
      PORT: 3100
      UI_ENABLED: ${UI_ENABLED:-true}
      # --- catch-all mailbox access (same account for IMAP read + SMTP send) ---
      IMAP_HOST: mailserver
      IMAP_PORT: 993
      IMAP_TLS: "true"
      IMAP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      IMAP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      SMTP_HOST: mailserver
      SMTP_PORT: 587
      SMTP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      SMTP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      TASK_SIGNING_SECRET: ${TASK_SIGNING_SECRET:?Set TASK_SIGNING_SECRET in .env (openssl rand -hex 32)}
      # DMS ships a self-signed cert until you configure Let's Encrypt, so
      # certificate verification stays off by default for these private hops.
      # Set either switch true in .env after configuring a trusted certificate.
      IMAP_TLS_REJECT_UNAUTHORIZED: ${IMAP_TLS_REJECT_UNAUTHORIZED:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
      # --- server-side ntfy notifications (agents never receive these creds) ---
      NTFY_ENABLED: ${NTFY_ENABLED:-true}
      NTFY_INTERNAL_URL: http://ntfy
      NTFY_STORAGE_DIR: /var/lib/openagentemail/ntfy
      NOTIFY_PUBLIC_URL: ${NOTIFY_PUBLIC_URL:-http://127.0.0.1:2586}
      NTFY_UPSTREAM: ${NTFY_UPSTREAM:-true}
      NTFY_ADMIN_PASSWORD: ${NTFY_ADMIN_PASSWORD:?Set NTFY_ADMIN_PASSWORD in .env (openssl rand -hex 24)}
      NOTIFY_RATE_LIMIT: ${NOTIFY_RATE_LIMIT:-10}
      PUSH_POLICY: ${PUSH_POLICY:-otp}
      # Optional dashboard origin for ntfy click actions on mail-arrival pushes.
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      # Optional public origin for MCP RFC 9728 metadata (overrides request Host).
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      # MCP tools/call per-token rate limits (per minute; 0 = off). Admin exempt.
      MCP_RATE_READ_PER_MIN: ${MCP_RATE_READ_PER_MIN:-60}
      MCP_RATE_WRITE_PER_MIN: ${MCP_RATE_WRITE_PER_MIN:-20}
      # Identity store (json) survives container recreation:
      DATA_DIR: /app/data
      # Per-identity send limit (messages/hour, 0 = off):
      SEND_RATE_LIMIT: ${SEND_RATE_LIMIT:-20}
      # Auto-delete mail older than this many days (0 = keep forever):
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_CHECK_HOURS: ${RETENTION_CHECK_HOURS:-6}
    volumes:
      - api-data:/app/data
    ports:
      # SAFETY DEFAULT: localhost only. Reach it from your agent host over an
      # SSH tunnel (ssh -L 3100:127.0.0.1:3100 user@server) or put a TLS
      # reverse proxy in front (see docs/security.md). Set API_BIND=0.0.0.0
      # in .env only if you know exactly why you need it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3100}:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3100/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mail-data:
  mail-state:
  mail-logs:
  api-data:
