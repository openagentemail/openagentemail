# openagent.email — one-command self-hosted email platform for AI agents.
#
# Two services:
#   mailserver — docker-mailserver (Postfix + Dovecot + OpenDKIM). ONE catch-all
#                mailbox on $DOMAIN; every identity address lands in it.
#   api        — the openagent.email REST/MCP API. Reads the catch-all via IMAP,
#                sends via SMTP with a rewritten From, exposes :3100.
#
# Usage:
#   cp .env.example .env   # fill in DOMAIN, API_KEYS, MAIL_PASSWORD
#   docker compose up -d
#   ./deploy/dns-records.sh
#   ./deploy/doctor.sh

name: openagentemail

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mail.${DOMAIN:?Set DOMAIN in .env}
    container_name: openagent-mailserver
    env_file: .env
    environment:
      # --- required DMS identity ---
      OVERRIDE_HOSTNAME: mail.${DOMAIN}
      # --- small-VPS defaults (tunable in .env if you have RAM to spare) ---
      ENABLE_CLAMAV: ${ENABLE_CLAMAV:-0}        # antivirus off: ClamAV needs ~1GB RAM
      ENABLE_FAIL2BAN: ${ENABLE_FAIL2BAN:-1}    # brute-force protection on
      ENABLE_SPAMASSASSIN: ${ENABLE_SPAMASSASSIN:-0}
      ONE_DIR: 1                                # single mail dir, simpler backups
      PERMIT_DOCKER: connected-networks         # trust the compose network (api -> smtp/imap)
      # DKIM signing is ON by default in docker-mailserver (opendkim).
      # Keys are generated by deploy/user-patches.sh on first start and land in
      # ./docker-data/dms/config/opendkim/keys/${DOMAIN}/ — dns-records.sh reads them.
      # --- optional outbound relay (SES, Mailgun, ...). Blank = send direct. ---
      DEFAULT_RELAY_HOST: ${DEFAULT_RELAY_HOST:-}
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-587}
      RELAY_USER: ${RELAY_USER:-}
      RELAY_PASSWORD: ${RELAY_PASSWORD:-}
    ports:
      - "25:25"     # SMTP    (inbound mail from the world)
      - "465:465"   # SMTPS   (implicit TLS submission)
      - "587:587"   # Submission (STARTTLS)
      - "993:993"   # IMAPS
      # Uncomment for HTTP-01 Let's Encrypt via DMS's built-in certbot
      # (requires SSL_TYPE=letsencrypt and SSL_DOMAIN=mail.${DOMAIN} in .env):
      # - "80:80"
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      # Bind-mounted (not a named volume) so you can inspect/edit DMS config and
      # so deploy/dns-records.sh can read the generated DKIM public key:
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      # Account + catch-all provisioning, runs inside the container at the end
      # of every startup (official DMS hook). Idempotent.
      - ./deploy/user-patches.sh:/tmp/docker-mailserver/user-patches.sh:ro
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      # SMTP + IMAPS listening means Postfix/Dovecot are up.
      test: ["CMD-SHELL", "ss --listening --tcp | grep -q ':25 ' && ss --listening --tcp | grep -q ':993 '"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s   # first boot generates DH params / DKIM keys — be patient

  api:
    build: ./packages/api
    container_name: openagent-api
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      # --- shared API contract env ---
      DOMAIN: ${DOMAIN}
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env (openssl rand -hex 32)}
      PORT: 3100
      # --- catch-all mailbox access (same account for IMAP read + SMTP send) ---
      IMAP_HOST: mailserver
      IMAP_PORT: 993
      IMAP_TLS: "true"
      IMAP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      IMAP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      SMTP_HOST: mailserver
      SMTP_PORT: 587
      SMTP_USER: ${MAIL_ACCOUNT:-agent}@${DOMAIN}
      SMTP_PASS: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      # DMS ships a self-signed cert until you configure Let's Encrypt; the api
      # talks to the mailserver over the private compose network, so allow it.
      TLS_REJECT_UNAUTHORIZED: "0"
      # Identity store (json) survives container recreation:
      DATA_DIR: /app/data
    volumes:
      - api-data:/app/data
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3100/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mail-data:
  mail-state:
  mail-logs:
  api-data:
