# Public HTTPS 443 reverse-proxy to the loopback receiver.
# Certificate paths and the server_name are deployment-order decisions.
# Public: /health (monitor) and /hooks/ (signed webhooks). /ready is private.

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name webhook-wake.example.com;

	ssl_certificate     /etc/ssl/certs/webhook-wake.example.com.pem;
	ssl_certificate_key /etc/ssl/private/webhook-wake.example.com.key;

	location = /health {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_read_timeout 15s;
	}

	location /hooks/ {
		# Optional: declare `limit_req_zone $binary_remote_addr zone=webhook_wake:10m rate=10r/s;`
		# in the http {} context, then uncomment the next line only here.
		# /health must not inherit this limit.
		# limit_req zone=webhook_wake burst=20 nodelay;
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_read_timeout 15s;
	}

	location / {
		return 404;
	}
}
